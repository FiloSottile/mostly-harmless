hostname
duid
persistent
noipv6
noarp

option domain_name_servers
option classless_static_routes
option interface_mtu
option rapid_commit

require dhcp_server_identifier

# Kept in the main table so Iliad takes over if the primary uplink dies, but
# never while eth0 has a lease: dhcpcd's automatic metrics start at 1000 plus
# the interface index, putting eth0 at 1002.
interface eth1
metric 2000
nohook resolv.conf
